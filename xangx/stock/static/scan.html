<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Παραλαβή · Xangxothaika</title>
<link rel="stylesheet" href="/static/vendor/phosphor/style.css">
<link rel="stylesheet" href="/static/vendor/phosphor/fill/style.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/stock/style.css">
</head>
<body>
<div class="page">
  <div class="band"><div class="in w1040">
    <div style="flex:1">
      <div class="kick"><a class="back" href="/"><i class="ph ph-caret-left"></i>Πίσω</a><span><i class="ph ph-barcode"></i> <span id="title">Παραλαβή</span></span></div>
      <h1><span class="huge" id="count">…</span></h1>
      <p class="lead">τεμάχια ήρθαν από όσα παραγγείλαμε</p>
      <div class="prog" id="prog" aria-hidden="true"><i id="bar"></i></div>
      <p class="trial" id="trial" hidden>Δοκιμή · δεν αποθηκεύεται τίποτα</p>
    </div>
  </div></div>
  <div class="wrap">
    <div class="row2 g-par">
      <div class="col">
        <section class="card">
          <div class="hd" aria-live="polite"><b id="last"><i class="ph ph-barcode"></i>Στόχευσε το barcode</b><span class="m" id="lastOf"></span></div>
          <video class="scanvid" id="v" autoplay playsinline muted hidden></video>
          <div class="fld">
            <label for="man">Με το χέρι ή σκάνερ USB</label>
            <div class="inp"><span class="box"><i class="ph ph-barcode"></i><input id="man" inputmode="numeric" autocomplete="off" enterkeyhint="done" placeholder="π.χ. 5449000000996"></span><button class="btn q" id="add" style="height:52px">Πρόσθεσε</button></div>
            <p class="m" id="st" style="margin-top:8px">Ξεκινώ…</p>
          </div>
        </section>
        <section class="card got miss" id="got" hidden>
          <div class="hd"><b><i class="ph ph-check-square"></i>Ήρθαν όλα</b><span class="m" id="gotOf"></span></div>
          <div id="gotList"></div>
        </section>
      </div>
      <div class="col">
        <section class="card miss" id="miss" hidden>
          <div class="hd" style="background:#FBEFEB"><b><i class="ph ph-warning-circle" style="color:var(--alert)"></i>Λείπουν</b><span class="warn" id="missOf"></span></div>
          <div id="missList"></div>
        </section>
        <section class="card miss" id="extra" hidden>
          <div class="hd"><b><i class="ph ph-question"></i>Δεν ήταν στην παραγγελία</b></div>
          <div id="extraList"></div>
        </section>
        <button class="btn yes wide" id="done" style="height:56px"><i class="ph ph-check"></i>Κλείσε την παραλαβή</button>
      </div>
    </div>
  </div>
</div>

<dialog id="ask" aria-labelledby="askTitle">
  <h2 id="askTitle" tabindex="-1">Να κλείσει η παραλαβή;</h2>
  <p id="askText" class="m"></p>
  <div class="acts"><button class="btn q" id="no">Όχι, συνεχίζω</button><button class="btn yes" id="yes">Ναι, κλείσε</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let order = params.get('order') || '';
// Practice (?dokimi=1): the same counter, but the scans stay on the phone and nothing is saved.
const practice = params.get('dokimi') === '1';
let deliveryId = null, closed = false, queue = Promise.resolve(), codes = [];
const say = t => $('st').textContent = t;
const setTitle = sup => { $('title').textContent = (practice ? 'Δοκιμή παραλαβής · ' : 'Παραλαβή · ') + order + (sup ? ' · ' + sup : ''); };
setTitle();
const euro = c => (c / 100).toLocaleString('el-GR', {style: 'currency', currency: 'EUR'});
// Camera errors in plain words (the browser gives only an English name).
function cameraProblem(name) {
  return ({NotAllowedError: 'Δεν δόθηκε άδεια για την κάμερα. Στο Safari: «aA» → Ρυθμίσεις ιστότοπου → Κάμερα → Να επιτρέπεται, και ανανέωση.',
           NotReadableError: 'Την κάμερα την κρατά άλλη εφαρμογή ή καρτέλα. Κλείσ’ την και κάνε ανανέωση.',
           NotFoundError: 'Δεν βρέθηκε κάμερα σε αυτή τη συσκευή.',
           OverconstrainedError: 'Δεν βρέθηκε κάμερα σε αυτή τη συσκευή.'}[name]
          || 'Αυτός ο browser δεν δίνει κάμερα.') + ' Μέχρι τότε γράψε ή σκάναρε με USB στο πεδίο.';
}
$('trial').hidden = !practice;
if (practice) $('done').hidden = true;

function closedNote(s) {
  const st = $('st');
  st.textContent = 'Η παραλαβή έκλεισε: ήρθαν ' + s.scanned + ' από ' + s.expected + '. Η κάμερα δεν ανοίγει σε κλειστή παραλαβή. ';
  const a = document.createElement('a');
  a.href = '?order=' + encodeURIComponent(order) + '&dokimi=1';
  a.textContent = 'Άνοιξε τη δοκιμή';
  a.style.cssText = 'font-weight:700;text-decoration:underline';
  st.appendChild(a);
}

const LOST = 'χάθηκε η σύνδεση με το μαγαζί';
async function post(path, body) {
  let r;
  try { r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}); }
  catch (e) { throw new Error(LOST); }
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j.detail || ('σφάλμα ' + r.status));
  return j;
}

// One row: number, name (with an optional muted second line), optional icon.
function row(num, name, sub, cls, icon, right) {
  const d = document.createElement('div'); d.className = 'ms';
  const b = document.createElement('b'); b.textContent = num; if (cls) b.className = cls;
  const t = document.createElement('span');
  if (sub) {
    const n = document.createElement('b'); n.textContent = name;
    const m = document.createElement('span'); m.className = 'm'; m.style.display = 'block'; m.textContent = sub;
    t.append(n, m);
  } else t.textContent = name;
  d.append(b, t);
  if (icon) { const i = document.createElement('i'); i.className = 'ph ' + icon; d.appendChild(i); }
  else { const r = document.createElement('span'); r.className = 'm'; r.textContent = right || ''; d.appendChild(r); }
  return d;
}
function fill(box, list, rows) { list.replaceChildren(...rows); box.hidden = !rows.length; }
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

function show(s) {
  closed = s.completed;
  setTitle(s.supplier_name);
  $('count').textContent = s.scanned + ' από ' + s.expected;
  $('bar').style.width = (s.expected ? Math.min(100, 100 * s.scanned / s.expected) : 0).toFixed(1) + '%';
  const full = s.lines.filter(l => l.scanned >= l.expected);
  fill($('got'), $('gotList'), full.map(l => row(String(l.expected), l.name, null, null, 'ph-check')));
  $('gotOf').textContent = full.length + ' από ' + s.lines.length + ' γραμμές';
  const gone = s.missing.reduce((n, m) => n + m.qty, 0);
  const byId = Object.fromEntries(s.lines.map(l => [l.product_id, l]));
  fill($('miss'), $('missList'), s.missing.map(m => {
    const l = byId[m.product_id];
    return row(String(m.qty), m.name, l ? 'ήρθαν ' + l.scanned + ' από ' + l.expected : null, 'q warn', null,
               m.value_cents ? euro(m.value_cents) : '');
  }));
  $('missOf').textContent = plural(gone, 'τεμάχιο', 'τεμάχια');
  const extra = s.extra.map(e => row(String(e.scanned), e.name))
    .concat(s.unknown_barcodes.map(b => row('?', 'άγνωστο barcode ' + b)));
  fill($('extra'), $('extraList'), extra);
  $('done').disabled = closed; $('man').disabled = closed; $('add').disabled = closed;
  if (closed) closedNote(s);
}

function setLast(ok, text, of) {
  const l = $('last'); l.replaceChildren();
  const i = document.createElement('i');
  i.className = ok ? 'ph-fill ph-check-circle' : 'ph ph-warning-circle';
  i.style.color = ok ? 'var(--ok)' : 'var(--alert)';
  l.append(i, document.createTextNode(text));
  $('lastOf').textContent = of || '';
}

function scan(code) {
  if (!deliveryId || closed) return;
  queue = queue.then(async () => {
    try {
      let s;
      if (practice) {
        codes.push(code);
        try { s = await post('/stock/delivery/practice', {order_id: order, barcodes: codes}); }
        catch (e) { codes.pop(); throw e; }
      } else s = await post('/stock/delivery/scan', {delivery_id: deliveryId, barcode: code});
      show(s);
      if (s.last.product_id) {
        const l = s.lines.find(x => x.product_id === s.last.product_id);
        setLast(true, 'Μετρήθηκε: ' + (s.last.units > 1 ? 'κιβώτιο ' + s.last.units + ' × ' : '') + s.last.name,
                l ? l.scanned + ' από ' + l.expected : '');
      } else setLast(false, 'Άγνωστο barcode: ' + code);
      if (navigator.vibrate) navigator.vibrate(60);
    } catch (e) {
      setLast(false, e.message === LOST ? 'Δεν μετρήθηκε: ' + LOST + '. Ξανασκάναρε το ίδιο barcode όταν επανέλθει.' : e.message);
      seen = {code: null, at: 0};  // the same barcode may count as soon as the line is back
    }
  });
}

function manual() {
  const code = $('man').value.replace(/\D/g, ''); $('man').value = '';
  if (code) scan(code);
  $('man').focus();
}
$('add').onclick = manual;
$('man').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); manual(); } });

$('done').onclick = () => {
  const missing = [...$('missList').children].map(d => d.children[0].textContent + ' ' + d.children[1].firstChild.textContent);
  const one = missing.length === 1 && missing[0].startsWith('1 ');
  $('askText').textContent = missing.length ? (one ? 'Λείπει ακόμα ' : 'Λείπουν ακόμα ') + missing.join(', ') + (missing.length === 1 ? '. Θα γραφτεί ως έλλειψη.' : '. Θα γραφτούν ως ελλείψεις.') : 'Ήρθαν όλα.';
  $('ask').showModal(); $('askTitle').focus();
};
$('no').onclick = () => $('ask').close();
$('yes').onclick = async () => {
  $('ask').close(); $('done').disabled = true;
  try { show(await post('/stock/delivery/complete', {delivery_id: deliveryId})); }
  catch (e) { say('Δεν έκλεισε: ' + e.message); $('done').disabled = false; }
};

// Camera: the same barcode counts once while it stays in the frame. It counts again only
// after it has been out of the frame for GONE_MS (taken away, next item brought in).
const GONE_MS = 1200;
let seen = {code: null, at: 0};
function fromCamera(code) {
  const now = Date.now();
  if (code === seen.code && now - seen.at < GONE_MS) { seen.at = now; return; }
  seen = {code, at: now};
  scan(code);
}

function loadScript(src) {
  return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
}

async function nativeDetector() {
  if (!('BarcodeDetector' in window)) return null;
  try {
    const have = await BarcodeDetector.getSupportedFormats();
    const want = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'].filter(f => have.includes(f));
    if (!want.length) return null;
    const det = new BarcodeDetector({formats: want});
    return async v => { const r = await det.detect(v); return r.length ? r[0].rawValue : null; };
  } catch (e) { return null; }
}

// Only when the browser cannot read barcodes itself (iPhone): zxing-wasm 3.1.6, served by us.
async function zxingDetector() {
  await loadScript('/stock/vendor/zxing-reader.js');
  ZXingWASM.prepareZXingModule({overrides: {locateFile: (p, prefix) => p.endsWith('.wasm') ? '/stock/vendor/zxing_reader.wasm' : prefix + p}, fireImmediately: true});
  const c = document.createElement('canvas'), ctx = c.getContext('2d', {willReadFrequently: true});
  const opts = {formats: ['EAN13', 'EAN8', 'UPCA', 'UPCE', 'Code128'], tryHarder: true, maxNumberOfSymbols: 1};
  return async v => {
    if (!v.videoWidth) return null;
    const w = Math.min(1280, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth);
    c.width = w; c.height = h; ctx.drawImage(v, 0, 0, w, h);
    const r = await ZXingWASM.readBarcodes(ctx.getImageData(0, 0, w, h), opts);
    const ok = r.find(x => x.isValid && x.text); return ok ? ok.text : null;
  };
}

async function startCamera() {
  if (!window.isSecureContext || !navigator.mediaDevices) { say('Χωρίς HTTPS δεν ανοίγει η κάμερα. Γράψε ή σκάναρε με USB στο πεδίο.'); return; }
  let decode = await nativeDetector();
  if (!decode) {
    say('Φορτώνω τον αναγνώστη barcode…');
    try { decode = await zxingDetector(); }
    catch (e) { say('Ο αναγνώστης δεν φόρτωσε. Γράψε ή σκάναρε με USB στο πεδίο.'); return; }
  }
  const v = $('v');
  try { v.srcObject = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}, width: {ideal: 1920}}, audio: false}); }
  catch (e) { say(cameraProblem(e.name)); return; }
  v.hidden = false; say('Στόχευσε το barcode. Ένα τεμάχιο τη φορά.');
  const loop = async () => {
    if (closed) return;
    try { const code = await decode(v); if (code) fromCamera(code); } catch (e) {}
    setTimeout(loop, 150);
  };
  loop();
}

async function start() {
  if (!order) {
    try { order = (await (await fetch('/stock/delivery/pending')).json()).order_id || ''; } catch (e) {}
    if (!order) { say('Δεν περιμένουμε καμία παραλαβή τώρα.'); $('done').disabled = true; return; }
    params.set('order', order); history.replaceState(null, '', '?' + params.toString()); setTitle();
  }
  try {
    const s = practice ? await post('/stock/delivery/practice', {order_id: order, barcodes: []})
                       : await post('/stock/delivery/start', {order_id: order});
    deliveryId = s.delivery_id; show(s);
  } catch (e) { say(e.message); $('done').disabled = true; return; }
  if (!closed) startCamera();
}
start();
</script>
</body>
</html>
