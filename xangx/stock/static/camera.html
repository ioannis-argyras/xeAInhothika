<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Κάμερα ραφιού · Xangxothaika</title>
<link rel="stylesheet" href="/static/vendor/phosphor/style.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/stock/style.css">
</head>
<body>
<div class="page">
  <div class="band"><div class="in w820">
    <div>
      <div class="kick"><a class="back" href="/"><i class="ph ph-caret-left"></i>Πίσω</a><span><i class="ph ph-device-mobile-camera"></i> <span id="kick">Κάμερα ραφιού</span></span></div>
      <h1 id="title">Κάμερα ραφιού</h1>
      <p class="trial" id="trial" hidden>Δοκιμή · δεν αποθηκεύεται τίποτα</p>
    </div>
  </div></div>
  <div class="wrap">
    <div class="row2 g-cam">
      <div class="vf"><video id="v" autoplay playsinline muted></video><span class="ts" id="st">Ανοίγω την κάμερα…</span></div>
      <div class="col">
        <section class="card">
          <div style="padding:20px"><button class="btn yes wide" id="now" style="height:56px"><i class="ph ph-camera"></i>Φωτογραφία τώρα</button></div>
          <div class="tog"><span id="autoLabel">Αυτόματα κάθε 30″</span><button class="sw" id="auto" role="switch" aria-checked="true" aria-labelledby="autoLabel"></button></div>
          <div class="tog"><span>Από τη συλλογή</span><label class="btn q" style="height:44px"><i class="ph ph-image"></i>Διάλεξε<input type="file" id="file" accept="image/*" hidden></label></div>
        </section>
        <section class="card" aria-live="polite">
          <div class="hd"><b><i class="ph ph-eye"></i>Τελευταία φωτογραφία</b><span class="m" id="when"></span></div>
          <div id="res"><div class="res"><span class="m">Δεν έχει τραβηχτεί ακόμα.</span></div></div>
        </section>
      </div>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const cam = params.get('cam') || 'cam-1';
// Practice (&dokimi=1): Claude counts as usual, but nothing is written and the real camera's
// previous photo stays as it was.
const practice = params.get('dokimi') === '1';
$('trial').hidden = !practice;
const v = $('v'); let timer = null, busy = false;
const say = t => $('st').textContent = t;
$('kick').textContent = (practice ? 'Δοκιμή κάμερας · ' : 'Κάμερα ραφιού · ') + cam;
fetch('/stock/camera/shelf?cam=' + encodeURIComponent(cam)).then(r => r.ok ? r.json() : null)
  .then(j => { if (j) { $('title').textContent = j.name; document.title = j.name + ' · Κάμερα ραφιού'; } }).catch(() => {});

// Camera errors in plain words (the browser gives only an English name).
function cameraProblem(name) {
  return ({NotAllowedError: 'Δεν δόθηκε άδεια για την κάμερα. Στο Safari: «aA» → Ρυθμίσεις ιστότοπου → Κάμερα → Να επιτρέπεται, και ανανέωση.',
           NotReadableError: 'Την κάμερα την κρατά άλλη εφαρμογή ή καρτέλα. Κλείσ’ την και κάνε ανανέωση.',
           NotFoundError: 'Δεν βρέθηκε κάμερα σε αυτή τη συσκευή.',
           OverconstrainedError: 'Δεν βρέθηκε κάμερα σε αυτή τη συσκευή.'}[name]
          || 'Αυτός ο browser δεν δίνει κάμερα.') + ' Μέχρι τότε χρησιμοποίησε «Από τη συλλογή».';
}

async function start() {
  if (!window.isSecureContext) { say('Χωρίς HTTPS ο browser δεν δίνει κάμερα. Χρησιμοποίησε «Από τη συλλογή».'); return; }
  try {
    v.srcObject = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}, width: {ideal: 1920}}, audio: false});
    say('Η κάμερα είναι έτοιμη.');
  } catch (e) { say(cameraProblem(e.name)); }
}

// Shrink to 1024 px wide, JPEG quality 0.8, then base64.
function toB64(source, w, h) {
  const scale = Math.min(1, 1024 / w), c = document.createElement('canvas');
  c.width = Math.round(w * scale); c.height = Math.round(h * scale);
  c.getContext('2d').drawImage(source, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.8).split(',')[1];
}
function fromCamera() {
  if (!v.videoWidth) throw new Error('η κάμερα δεν είναι έτοιμη');
  return toB64(v, v.videoWidth, v.videoHeight);
}
async function fromFile(file) {
  const img = await createImageBitmap(file);
  return toB64(img, img.width, img.height);
}

function line(bold, muted) {
  const d = document.createElement('div'); d.className = 'res';
  if (bold) { const b = document.createElement('b'); b.textContent = bold; d.appendChild(b); }
  if (muted) { const m = document.createElement('span'); m.className = 'm'; m.textContent = muted; d.appendChild(m); }
  return d;
}
function show(j) {
  const box = $('res'); box.replaceChildren();
  if (j.first) { box.appendChild(line(null, 'Πρώτη φωτογραφία: την κρατώ για σύγκριση.')); return; }
  const moved = (j.results || []).filter(r => r.taken > 0 || r.added > 0);
  if (!moved.length) { box.appendChild(line(null, 'Καμία αλλαγή στο ράφι.')); return; }
  for (const r of moved) {
    const parts = [];
    if (r.taken > 0) parts.push('πήραν ' + r.taken);
    if (r.added > 0) parts.push('γέμισαν ' + r.added);
    box.appendChild(line(r.position_name + ': ' + parts.join(', ') + ' ' + r.product_name));
  }
}

async function send(b64) {
  if (busy) return; busy = true; $('now').disabled = true;
  const t0 = Date.now(); say('Στέλνω και ρωτάω τι άλλαξε…');
  try {
    const r = await fetch('/stock/camera/photo', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({camera_id: cam, image_b64: b64, practice})});
    let j = {};
    try { j = await r.json(); } catch (e) {}
    if (!r.ok) { say(j.detail || 'Ο server δεν μπόρεσε να τη διαβάσει (σφάλμα ' + r.status + '). Δοκίμασε ξανά.'); return; }
    show(j);
    const now = new Date().toLocaleTimeString('el-GR', {hour12: false});
    $('when').textContent = now;
    say(now + ' · ' + ((Date.now() - t0) / 1000).toFixed(1).replace('.', ',') + '″');
  } catch (e) { say('Η φωτογραφία δεν έφτασε: χάθηκε η σύνδεση με το μαγαζί. Πάτα ξανά όταν επανέλθει.'); }
  finally { busy = false; $('now').disabled = false; }
}

$('now').onclick = () => { try { send(fromCamera()); } catch (e) { say('Σφάλμα: ' + e.message); } };
$('file').onchange = e => { const f = e.target.files[0]; if (f) fromFile(f).then(send).catch(err => say('Σφάλμα: ' + err.message)); e.target.value = ''; };
function setAuto() {
  clearInterval(timer);
  if ($('auto').getAttribute('aria-checked') === 'true') timer = setInterval(() => { try { send(fromCamera()); } catch (e) {} }, 30000);
}
if (practice) $('auto').setAttribute('aria-checked', 'false');
$('auto').onclick = () => {
  const on = $('auto').getAttribute('aria-checked') !== 'true';
  $('auto').setAttribute('aria-checked', String(on)); setAuto();
};
start().then(setAuto);
</script>
</body>
</html>
